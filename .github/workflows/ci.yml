name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Set up Python
        run: uv python install 3.13
      - name: Check lockfile
        run: uv lock --check
      - name: Install dependencies
        run: uv sync --locked
      - name: Lint and format check
        run: |
          uv run ruff check .
          uv run ruff format --check .
      - name: Run tests with coverage
        run: uv run pytest -q --cov=src/campaign --cov-fail-under=85
